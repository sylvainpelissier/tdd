[build-system]
requires = ["uv_build>=0.7,<1.0"]
build-backend = "uv_build"

[project]
name = "tddoc"
version = "0.3"
description = "2D-Doc toolsuite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Nicolas Pouillon", email = "nipo@ssji.net" },
]
maintainers = [
  {name = "Sylvain Pelissier", email = "sylvain.pelissier@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "cryptography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Text Processing :: General",
]

[project.urls]
Homepage = "https://github.com/sylvainpelissier/tddoc"

[project.optional-dependencies]
fetch = ["lxml", "requests", "xmlsec"]
dev = ["tddoc[fetch]", "pytest", "pyyaml", "ruff"]

[project.scripts]
tddoc-fetch-chains = "tddoc.fetch_chains:main"
tddoc-dump = "tddoc.dump:main"

[tool.uv.build-backend]
module-name = "tddoc"
module-root = ""
source-include = ["tests/**", "CHANGELOG.md"]

